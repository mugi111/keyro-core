[workspace]
members = [
  "crates/core-app",
  "crates/core-domain",
  "crates/core-ipc",
  "crates/core-platform",
  "crates/core-storage-sqlite",
  "crates/keyro-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mugi111/keyro-core"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1.0.86"
keyro-core-app = { path = "crates/core-app" }
keyro-core-domain = { path = "crates/core-domain" }
keyro-core-ipc = { path = "crates/core-ipc" }
keyro-core-platform = { path = "crates/core-platform" }
keyro-core-storage-sqlite = { path = "crates/core-storage-sqlite" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tempfile = "3.10.1"
thiserror = "1.0.63"
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
url = "2.5.2"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
